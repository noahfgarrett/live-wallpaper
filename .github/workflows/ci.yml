name: CI

on:
    push:
    pull_request:

permissions:
    contents: read

jobs:
    build:
        runs-on: windows-latest
        env:
            DOTNET_CLI_TELEMETRY_OPTOUT: 1
            DOTNET_NOLOGO: 1
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
              with:
                  global-json-file: global.json

            - name: Restore
              run: dotnet restore --locked-mode

            - name: Build
              run: dotnet build -c Release --no-restore

            - name: Test
              run: dotnet test -c Release --no-build

            - name: Publish engine and app
              run: |
                  dotnet publish src/LiveWallpaper.Engine -c Release -r win-x64 --self-contained -p:DebugType=embedded -o artifacts/LiveWallpaper
                  dotnet publish src/LiveWallpaper.App -c Release -r win-x64 --self-contained -p:DebugType=embedded -o artifacts/LiveWallpaper

            - name: Smoke test the engine
              shell: pwsh
              run: |
                  foreach ($exe in 'LiveWallpaper.exe', 'LiveWallpaper.Engine.exe') {
                      if (-not (Test-Path "artifacts/LiveWallpaper/$exe")) { throw "$exe is missing from the build" }
                  }
                  $p = Start-Process -FilePath artifacts/LiveWallpaper/LiveWallpaper.Engine.exe -ArgumentList '--list-monitors' -Wait -PassThru
                  if ($p.ExitCode -ne 0) { throw "LiveWallpaper.Engine.exe --list-monitors exited with $($p.ExitCode)" }

            - name: Upload build
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: LiveWallpaper-win-x64
                  path: artifacts/LiveWallpaper
                  retention-days: 14
